version: '3.8'

services:
  face-recognition:
    build: .
    ports:
      - "5000:5000"
    environment:
      - API_KEY=your-secret-key
      - MODEL_NAME=Facenet
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Optional: Add a test client
  test-client:
    image: curlimages/curl
    depends_on:
      - face-recognition
    command: >
      sh -c "
        sleep 5 &&
        curl -X GET http://face-recognition:5000/health
      "
    profiles:
      - test